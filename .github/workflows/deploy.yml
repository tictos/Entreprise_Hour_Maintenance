name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Permissions requises pour déployer sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permet d'annuler les déploiements concurrents en cours
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du code (Checkout)
        uses: actions/checkout@v4

      - name: ⚙️ Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Installation des dépendances
        run: npm install

      - name: 🔨 Construction du site (Build Vite)
        run: npm run build

      - name: 🌐 Configuration de GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📤 Envoi de l'artefact de build
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: 🚀 Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
